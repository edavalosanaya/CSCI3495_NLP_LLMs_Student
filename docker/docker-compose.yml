# CSCI 3495 — Ollama only.
#
# Python is NOT in Docker any more. The whole course runs in one uv environment
# managed from the repository root, which is what makes Jupyter show exactly one
# kernel. Docker's only remaining job is the local LLM server.
#
#   docker compose -f docker/docker-compose.yml up -d ollama    # start it
#   docker compose -f docker/docker-compose.yml stop ollama     # stop it
#
# Already have the old course image? Reclaim the space:
#   bash scripts/cleanup_course_docker.sh
services:
  # Local, free, open-source LLM inference. No API keys, no account, runs on CPU.
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      # Downloaded models live here. This volume is worth several GB once you
      # have pulled a model, so keep it between semesters.
      - ollama_models:/root/.ollama
    restart: unless-stopped

volumes:
  ollama_models:
